<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShubhMilan — Trusted Matrimony, Free for Everyone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ============ Professional design system ============ */
:root{
  --primary:#8b1e3f;          /* deep wine/maroon */
  --primary-dark:#5f1029;
  --primary-50:#fdf3f6;
  --primary-100:#f8dce5;
  --accent:#c8a45c;            /* muted gold */
  --accent-dark:#9e7f3f;
  --ink:#1a1a1a;
  --text:#2e2e33;
  --muted:#6e6e78;
  --line:#e7e5ea;
  --bg:#fafafa;
  --card:#ffffff;
  --success:#1e8a5f;
  --success-50:#e6f5ee;
  --danger:#c0392b;
  --danger-50:#fbecea;
  --warn:#b57a00;
  --warn-50:#fff6e0;
  --info:#1e5fa8;
  --info-50:#e7f0fa;
  --radius-sm:8px;
  --radius:12px;
  --radius-lg:18px;
  --shadow-xs:0 1px 2px rgba(15,15,20,.04);
  --shadow:0 4px 14px rgba(20,20,30,.06);
  --shadow-lg:0 16px 40px rgba(20,20,30,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);background:var(--bg);font-size:15px;line-height:1.55}
h1,h2,h3,h4{font-family:'Playfair Display','Inter',serif;color:var(--ink);letter-spacing:-.01em;font-weight:700;margin:0 0 10px}
h1{font-size:34px;line-height:1.15}
h2{font-size:26px;line-height:1.2}
h3{font-size:18px;line-height:1.3;font-family:'Inter',sans-serif;font-weight:700}
p{margin:0 0 12px}
a{color:var(--primary);text-decoration:none}
a:hover{color:var(--primary-dark)}
img{max-width:100%;display:block}
.hidden{display:none!important}
.muted{color:var(--muted)}
.center{text-align:center}
.mt-1{margin-top:10px}.mt-2{margin-top:18px}.mt-3{margin-top:28px}.mt-4{margin-top:40px}
.mb-1{margin-bottom:10px}.mb-2{margin-bottom:18px}.mb-3{margin-bottom:28px}

/* Top bar */
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:0 28px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;gap:10px;min-height:68px}
.topbar .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;cursor:pointer;color:var(--primary-dark);font-family:'Playfair Display',serif;letter-spacing:-.01em}
.topbar .brand .logo{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;display:grid;place-items:center;font-size:16px;box-shadow:0 2px 8px rgba(139,30,63,.3)}
.topbar nav{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.topbar nav a{color:var(--text);font-weight:500;cursor:pointer;padding:8px 14px;border-radius:8px;font-size:14px;display:inline-flex;align-items:center;gap:7px}
.topbar nav a i{color:var(--muted);font-size:13px}
.topbar nav a:hover{background:var(--primary-50);color:var(--primary)}
.topbar nav a:hover i{color:var(--primary)}
.topbar nav a.active{background:var(--primary-50);color:var(--primary-dark);font-weight:600}
.topbar nav a.active i{color:var(--primary)}
.topbar .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip-free{background:var(--success-50);color:var(--success);font-weight:600;padding:5px 11px;border-radius:20px;font-size:12px;display:inline-flex;align-items:center;gap:6px;border:1px solid #c2e5d4}
@media (max-width:980px){.topbar{padding:0 14px}.topbar nav a{padding:6px 10px;font-size:13px}.topbar nav a span{display:none}.topbar nav a i{font-size:16px;color:var(--text)}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;border-radius:8px;border:1px solid transparent;font-weight:600;cursor:pointer;font-size:14px;transition:all .18s;font-family:inherit;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark);color:#fff;box-shadow:0 6px 16px rgba(139,30,63,.28)}
.btn-accent{background:var(--accent);color:#fff}.btn-accent:hover{background:var(--accent-dark);color:#fff}
.btn-outline{background:transparent;border:1.5px solid #fff;color:#fff}.btn-outline:hover{background:#fff;color:var(--primary)}
.btn-outline-primary{background:transparent;border:1.5px solid var(--primary);color:var(--primary)}
.btn-outline-primary:hover{background:var(--primary);color:#fff}
.btn-ghost{background:#f2f2f5;color:var(--text);border:1px solid #eaeaf0}.btn-ghost:hover{background:#e8e8ee}
.btn-sm{padding:6px 12px;font-size:12.5px;gap:5px}
.btn-lg{padding:13px 26px;font-size:15px}
.btn-danger{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-block{display:flex;width:100%}
.btn-icon{padding:9px 11px}

/* Layout */
.container{max-width:1200px;margin:0 auto;padding:28px 24px}
.row{display:flex;flex-wrap:wrap;gap:20px}
.col{flex:1;min-width:0}
.grid{display:grid;gap:20px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media (max-width:900px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-xs);overflow:hidden;transition:.2s}
.card:hover{box-shadow:var(--shadow)}
.card-body{padding:20px}
.card-title{margin:0 0 6px;font-size:18px;font-family:'Inter',sans-serif}

/* Forms */
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;margin-bottom:6px;font-size:13px;color:var(--ink)}
.field label .req{color:var(--danger);margin-left:2px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1px solid #d8d8df;border-radius:var(--radius-sm);font-size:14px;background:#fff;font-family:inherit;color:var(--ink);transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(139,30,63,.1)}
.field textarea{min-height:90px;resize:vertical}
.field .hint{font-size:12px;color:var(--muted);margin-top:4px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-row-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:640px){.form-row,.form-row-3{grid-template-columns:1fr}}
.input-icon{position:relative}
.input-icon i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px}
.input-icon input{padding-left:38px}

/* Hero */
.hero{background:linear-gradient(135deg,var(--primary-dark) 0%,var(--primary) 55%,#a83157 100%);color:#fff;padding:90px 24px 100px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 20% 30%,rgba(200,164,92,.22),transparent 50%),radial-gradient(ellipse at 80% 70%,rgba(255,255,255,.08),transparent 50%);pointer-events:none}
.hero > *{position:relative;z-index:1}
.hero .kicker{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);backdrop-filter:blur(6px);padding:7px 16px;border-radius:30px;font-size:13px;font-weight:500;margin-bottom:20px;border:1px solid rgba(255,255,255,.2)}
.hero h1{font-size:54px;margin:0 0 14px;color:#fff;font-weight:700;line-height:1.1;max-width:820px;margin-left:auto;margin-right:auto}
.hero .sub{font-size:18px;opacity:.9;max-width:620px;margin:0 auto 30px;font-weight:400}
.hero .cta-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.hero .trust{margin-top:36px;display:flex;gap:28px;justify-content:center;flex-wrap:wrap;font-size:14px;opacity:.85}
.hero .trust div{display:flex;align-items:center;gap:7px}
.hero .trust i{color:var(--accent)}
@media (max-width:700px){.hero{padding:60px 20px 70px}.hero h1{font-size:36px}.hero .sub{font-size:16px}}

/* Hero search */
.hero-search{max-width:760px;margin:28px auto 0;background:#fff;border-radius:16px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:8px;align-items:end}
.hero-search .field{margin:0;text-align:left}
.hero-search .field label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.hero-search .field select{border:none;padding:6px 2px;font-weight:600;color:var(--ink);background:transparent;font-size:14px}
.hero-search .field:not(:last-child){border-right:1px solid var(--line);padding:6px 12px}
@media (max-width:700px){.hero-search{grid-template-columns:1fr 1fr;gap:14px}.hero-search .field:not(:last-child){border-right:none;padding:0}.hero-search button{grid-column:1 / -1}}

/* Profile cards */
.profile-card{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-xs);border:1px solid var(--line);display:flex;flex-direction:column;cursor:pointer;transition:.25s}
.profile-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--primary-100)}
.profile-card .photo{width:100%;aspect-ratio:3/4;background:linear-gradient(135deg,#f4e7eb,#ead2db);display:grid;place-items:center;color:var(--primary);font-size:54px;font-weight:700;position:relative;overflow:hidden}
.profile-card .photo img{width:100%;height:100%;object-fit:cover}
.profile-card .verified{position:absolute;top:10px;right:10px;background:rgba(30,138,95,.95);color:#fff;padding:4px 9px;border-radius:20px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px;backdrop-filter:blur(4px)}
.profile-card .online{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.92);color:var(--success);padding:4px 9px;border-radius:20px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.profile-card .online::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--success);display:inline-block}
.profile-card .info{padding:14px 16px;flex:1;display:flex;flex-direction:column}
.profile-card .info h3{margin:0 0 4px;font-size:16px;color:var(--ink);font-weight:700}
.profile-card .info .meta{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:3px}
.profile-card .info .meta i{font-size:11px;width:12px;color:var(--primary);opacity:.7}
.profile-card .info .tags{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.profile-card .info .tag{background:var(--primary-50);color:var(--primary-dark);padding:3px 9px;border-radius:12px;font-size:11px;font-weight:600}
.profile-card .pc-actions{display:flex;gap:6px;margin-top:auto;padding:10px 14px 14px;border-top:1px solid var(--line)}
.profile-card .pc-actions .btn{flex:1;font-size:12px;padding:7px}

/* Tables */
table.data{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-xs);border:1px solid var(--line)}
table.data th,table.data td{padding:13px 16px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
table.data th{background:#f7f6f9;color:var(--ink);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.7px}
table.data tr:last-child td{border-bottom:0}
table.data tr:hover td{background:#fcfbfd}

/* Pills / badges */
.status-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:20px;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.status-active{background:var(--success-50);color:var(--success)}
.status-pending{background:var(--warn-50);color:var(--warn)}
.status-inactive{background:#f0f0f4;color:var(--muted)}
.status-banned{background:var(--danger-50);color:var(--danger)}
.status-verified{background:var(--info-50);color:var(--info)}

/* Alerts */
.alert{padding:14px 18px;border-radius:var(--radius);margin:14px 0;font-size:14px;border:1px solid;display:flex;gap:12px;align-items:flex-start}
.alert i{font-size:18px;margin-top:1px;flex-shrink:0}
.alert-info{background:var(--info-50);border-color:#c9ddef;color:#1e5fa8}
.alert-info i{color:var(--info)}
.alert-warn{background:var(--warn-50);border-color:#f1dfae;color:#7c5403}
.alert-warn i{color:var(--warn)}
.alert-success{background:var(--success-50);border-color:#b9e0cd;color:#0f6f4a}
.alert-success i{color:var(--success)}

/* Footer */
footer{background:#1a1a1f;color:#c6c6d0;padding:56px 24px 28px;margin-top:60px}
footer .fwrap{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:40px}
@media (max-width:800px){footer .fwrap{grid-template-columns:1fr 1fr}}
@media (max-width:500px){footer .fwrap{grid-template-columns:1fr}}
footer h4{color:#fff;margin:0 0 14px;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;font-family:'Inter',sans-serif}
footer a{color:#c6c6d0;display:block;padding:4px 0;font-size:14px}
footer a:hover{color:var(--accent)}
footer .brand-f{font-family:'Playfair Display',serif;font-size:22px;color:#fff;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:10px}
footer .brand-f .logo{width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:15px}
footer .copy{text-align:center;padding-top:28px;margin-top:36px;border-top:1px solid #2a2a33;color:#8a8a95;font-size:13px;max-width:1200px;margin-left:auto;margin-right:auto}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.25);z-index:2000;font-size:14px;transition:transform .25s;display:flex;align-items:center;gap:10px}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast i{color:var(--accent)}

/* Profile detail */
.prof-hero{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-xs);margin-bottom:20px}
.prof-hero .pwrap{display:grid;grid-template-columns:320px 1fr;gap:0}
@media (max-width:760px){.prof-hero .pwrap{grid-template-columns:1fr}}
.prof-hero .photo-main{aspect-ratio:1/1;background:linear-gradient(135deg,#f4e7eb,#ead2db);display:grid;place-items:center;color:var(--primary);font-size:90px;font-weight:700;overflow:hidden}
.prof-hero .photo-main img{width:100%;height:100%;object-fit:cover}
.prof-hero .prof-info{padding:26px 28px}
.prof-hero .prof-info h1{font-size:30px;margin:0 0 4px}
.prof-hero .badge-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px}
.prof-hero .badge-row .bg{background:var(--primary-50);color:var(--primary-dark);padding:5px 11px;border-radius:20px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.prof-hero .badge-row .bg.verified{background:var(--success-50);color:var(--success)}
.prof-hero .kv-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 20px;margin:18px 0}
@media (max-width:500px){.prof-hero .kv-grid{grid-template-columns:1fr}}
.prof-hero .kv-grid .kv{display:flex;align-items:flex-start;gap:10px}
.prof-hero .kv-grid .kv i{width:28px;height:28px;background:var(--primary-50);color:var(--primary);border-radius:50%;display:grid;place-items:center;font-size:12px;flex-shrink:0}
.prof-hero .kv-grid .kv .kv-l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.prof-hero .kv-grid .kv .kv-v{font-size:14px;color:var(--ink);font-weight:500}
.prof-hero .prof-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:18px;border-top:1px solid var(--line)}

.section{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px 26px;margin-bottom:18px;box-shadow:var(--shadow-xs)}
.section h2{margin:0 0 14px;font-size:18px;font-family:'Inter',sans-serif;color:var(--ink);display:flex;align-items:center;gap:10px}
.section h2 i{color:var(--primary);font-size:15px;width:30px;height:30px;background:var(--primary-50);border-radius:8px;display:grid;place-items:center}
.dl-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 30px}
@media (max-width:500px){.dl-grid{grid-template-columns:1fr}}
.dl-grid .dl-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.dl-grid .dl-row .dl-l{color:var(--muted);font-weight:500}
.dl-grid .dl-row .dl-v{color:var(--ink);font-weight:600;text-align:right}
.photos-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:500px){.photos-strip{grid-template-columns:repeat(2,1fr)}}
.photos-strip .p{aspect-ratio:1/1;background:linear-gradient(135deg,#f4e7eb,#ead2db);border-radius:var(--radius-sm);display:grid;place-items:center;color:var(--primary);overflow:hidden;font-size:30px}
.photos-strip .p img{width:100%;height:100%;object-fit:cover}

/* Dashboard */
.stat-tile{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow-xs);transition:.2s}
.stat-tile:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.stat-tile .icon{width:52px;height:52px;border-radius:12px;background:var(--primary-50);color:var(--primary);display:grid;place-items:center;font-size:20px;flex-shrink:0}
.stat-tile .num{font-size:28px;font-weight:700;color:var(--ink);line-height:1;font-family:'Playfair Display',serif}
.stat-tile .lbl{font-size:13px;color:var(--muted);margin-top:4px;font-weight:500}

/* Filter sidebar */
.filter-side{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-xs);position:sticky;top:90px;align-self:flex-start}
.filter-side h3{font-size:15px;margin:0 0 14px;display:flex;align-items:center;gap:8px;color:var(--ink);padding-bottom:12px;border-bottom:1px solid var(--line)}
.filter-side h3 i{color:var(--primary)}

/* Tabs (admin) */
.admin-wrap{display:grid;grid-template-columns:260px 1fr;gap:24px}
@media (max-width:900px){.admin-wrap{grid-template-columns:1fr}}
.admin-side{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:8px;box-shadow:var(--shadow-xs);position:sticky;top:90px;align-self:flex-start;height:max-content}
.admin-side h4{padding:12px 14px 4px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.7px;margin:0;font-family:'Inter',sans-serif;font-weight:600}
.admin-side a{display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:8px;color:var(--text);font-size:14px;font-weight:500;cursor:pointer;margin-bottom:2px}
.admin-side a i{width:18px;text-align:center;color:var(--muted);font-size:14px}
.admin-side a:hover{background:var(--primary-50);color:var(--primary)}
.admin-side a:hover i{color:var(--primary)}
.admin-side a.active{background:var(--primary);color:#fff}
.admin-side a.active i{color:#fff}
.admin-main{min-width:0}
.page-head{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 22px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;box-shadow:var(--shadow-xs)}
.page-head h2{margin:0;font-size:22px}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:2px}

/* Chat */
.chat-wrap{display:grid;grid-template-columns:320px 1fr;gap:0;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;height:calc(100vh - 200px);min-height:500px;box-shadow:var(--shadow-xs)}
@media (max-width:800px){.chat-wrap{grid-template-columns:1fr;height:auto}}
.chat-list{border-right:1px solid var(--line);overflow-y:auto}
.chat-list .item{padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:12px;align-items:center;transition:.15s}
.chat-list .item:hover{background:var(--primary-50)}
.chat-list .item.active{background:var(--primary-50);border-left:3px solid var(--primary)}
.chat-list .avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#f4e7eb,#ead2db);display:grid;place-items:center;color:var(--primary);font-weight:700;flex-shrink:0;overflow:hidden;font-size:16px}
.chat-list .avatar img{width:100%;height:100%;object-fit:cover}
.chat-list .name{font-weight:600;font-size:14px;color:var(--ink)}

.steps .s .dot{width:40px;height:40px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;color:var(--muted);font-weight:700;font-size:14px;transition:.2s}

.feature{display:flex;gap:16px;padding:20px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-xs);transition:.2s}

.how-step{text-align:center;padding:20px}

.how-step h3{margin:0 0 6px;font-size:16px}
.how-step p{font-size:13.5px;color:var(--muted);margin:0}

.section-title{text-align:center;margin:0 auto 34px;max-width:600px}
.section-title .kicker{color:var(--primary);font-weight:600;font-size:13px;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:6px;display:block}
.section-title h2{font-size:32px;margin:0 0 10px}
.section-title p{color:var(--muted);font-size:15px;margin:0}

.testimonial{background:#fff;padding:24px;border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow-xs)}

.testimonial .who{display:flex;align-items:center;gap:12px}
.testimonial .who .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#f4e7eb,#ead2db);color:var(--primary);display:grid;place-items:center;font-weight:700}
.testimonial .who .n{font-weight:600;color:var(--ink);font-size:14px}
.testimonial .who .m{font-size:12px;color:var(--muted)}

.stars{color:var(--accent);margin-bottom:10px;font-size:13px}

/* Auth box */
.auth-card{max-width:460px;margin:50px auto;background:#fff;border-radius:var(--radius-lg);padding:40px;box-shadow:var(--shadow-lg);border:1px solid var(--line)}

.auth-card .sub{text-align:center;color:var(--muted);margin-bottom:26px;font-size:14px}
.demo-note{background:var(--info-50);border:1px solid #c9ddef;padding:10px 14px;border-radius:10px;font-size:12.5px;color:var(--info);margin-top:14px}

.div{height:1px;background:var(--line);margin:18px 0}

/* Utility */
.tag-sm{display:inline-flex;align-items:center;gap:4px;background:var(--primary-50);color:var(--primary-dark);padding:3px 9px;border-radius:12px;font-size:11px;font-weight:600}
.ic-lg{font-size:40px;color:var(--primary);opacity:.85}
.flex{display:flex}
.flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}

/* AI Match score */
.ai-score{position:absolute;top:10px;left:10px;background:linear-gradient(135deg,#6d28d9,#8b5cf6);color:#fff;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:5px;box-shadow:0 4px 12px rgba(109,40,217,.35);z-index:2}
.ai-score i{font-size:10px}
.ai-chip{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#f3e8ff,#ede9fe);color:#6d28d9;padding:4px 11px;border-radius:16px;font-size:12px;font-weight:700;border:1px solid #ddd6fe}
.ai-chip i{color:#7c3aed}
.ai-widget{background:linear-gradient(135deg,#faf5ff,#f3e8ff);border:1px solid #ddd6fe;border-radius:var(--radius);padding:20px;margin-bottom:18px}
.ai-widget .head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ai-widget .head i{width:38px;height:38px;background:linear-gradient(135deg,#6d28d9,#8b5cf6);color:#fff;border-radius:10px;display:grid;place-items:center;font-size:16px}
.ai-widget h3{margin:0;font-size:15px;color:#4c1d95;font-family:'Inter',sans-serif}
.ai-widget .score-circle{float:right;width:72px;height:72px;border-radius:50%;background:conic-gradient(#6d28d9 var(--deg,324deg),#ede9fe 0);display:grid;place-items:center;position:relative;margin-left:14px}
.ai-widget .score-circle::before{content:"";position:absolute;inset:6px;background:#fff;border-radius:50%}
.ai-widget .score-circle span{position:relative;font-weight:800;font-size:18px;color:#6d28d9;font-family:'Playfair Display',serif}
.ai-reasons{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.ai-reasons li{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:#4c1d95}
.ai-reasons li i{color:#7c3aed;margin-top:3px;font-size:11px}

const Store={
  load(){
    try{
      const raw=localStorage.getItem(STORE_KEY);
      const saved=raw?JSON.parse(raw):null;
      const def=JSON.parse(JSON.stringify(DEFAULT_STATE));
      if(!saved)return def;
      // Forward-compatible merge: any keys missing from saved state inherit defaults
      const merged={...def,...saved};
      // Ensure critical arrays/objects are never undefined
      merged.profiles=saved.profiles&&saved.profiles.length?saved.profiles:def.profiles;
      merged.successStories=saved.successStories||def.successStories;
      merged.events=saved.events||def.events;
      merged.blogPosts=saved.blogPosts||def.blogPosts;
      merged.plans=saved.plans||def.plans;
      merged.admins=saved.admins||def.admins;
      merged.settings={...def.settings,...(saved.settings||{})};
      merged.shortlist=saved.shortlist||[];
      merged.interestsSent=saved.interestsSent||[];
      merged.interestsReceived=saved.interestsReceived||[];
      merged.messages=saved.messages||{};
      merged.reports=saved.reports||[];
      return merged;
    }catch(e){return JSON.parse(JSON.stringify(DEFAULT_STATE));}
  },
  save(s){localStorage.setItem(STORE_KEY,JSON.stringify(s));},
  reset(){localStorage.removeItem(STORE_KEY);}
};
// Always re-save merged state so new fields are persisted

function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg,icon='fa-circle-check'){const t=document.createElement('div');t.className='toast';t.innerHTML=`<i class="fa-solid ${icon}"></i><span>${msg}</span>`;document.getElementById('toast-host').appendChild(t);setTimeout(()=>t.classList.add('show'),10);setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},2400);}

/* ========================= AI Match engine ========================= */
function aiMatchScore(me,p){
  if(!me||!p||me.id===p.id)return 0;
  let score=55; const reasons=[];
  // Religion (high weight)
  if(me.religion===p.religion){score+=10;reasons.push({ic:'fa-om',t:`Same religion — ${p.religion}`});}
  // Mother tongue
  if(me.motherTongue===p.motherTongue){score+=5;reasons.push({ic:'fa-language',t:`Both speak ${p.motherTongue}`});}
  // Diet compatibility
  if(me.diet===p.diet){score+=4;reasons.push({ic:'fa-utensils',t:`Shared diet preference — ${p.diet}`});}
  // Similar education tier
  const eduRank=['High School','Diploma','Bachelors','Masters','Doctorate','Post-Doctorate','Professional'];
  const meE=eduRank.indexOf(me.education),pE=eduRank.indexOf(p.education);
  if(Math.abs(meE-pE)<=1){score+=6;reasons.push({ic:'fa-graduation-cap',t:`Similar education levels`});}
  // Shared hobbies
  const shared=(me.hobbies||[]).filter(h=>(p.hobbies||[]).includes(h));
  if(shared.length>=2){score+=6;reasons.push({ic:'fa-heart',t:`${shared.length} shared interests: ${shared.slice(0,2).join(', ')}`});}
  else if(shared.length===1){score+=3;reasons.push({ic:'fa-heart',t:`Shared interest: ${shared[0]}`});}
  // Caste
  if(me.caste===p.caste){score+=4;reasons.push({ic:'fa-users-line',t:`Same community — ${p.caste}`});}
  // Manglik compatibility
  if(me.manglik===p.manglik||(me.manglik==='No'&&p.manglik==='No')){score+=3;reasons.push({ic:'fa-star',t:`Compatible manglik status`});}
  // AI traits overlap
  const traits=(me.aiTraits||[]).filter(t=>(p.aiTraits||[]).includes(t));
  if(traits.length){score+=Math.min(traits.length*2,6);reasons.push({ic:'fa-wand-magic-sparkles',t:`Personality match: ${traits.slice(0,2).join(', ')}`});}
  // Trust bonus
  if(p.trustScore>=85){score+=3;reasons.push({ic:'fa-shield-halved',t:`Highly verified profile (${p.trustScore}% trust)`});}
  // Family values
  if(me.familyValues===p.familyValues){score+=2;reasons.push({ic:'fa-house-user',t:`Aligned family values — ${p.familyValues}`});}
  return {score:Math.min(score,98),reasons:reasons.slice(0,5)};
}

function profileCardHTML(p,opts={}){
  const s=Store.load();
  const me=getMe(s);
  const ai=me&&me.id!==p.id?aiMatchScore(me,p):null;
  const firstPhoto=p.photos&&p.photos[0];
  const blur=p.photosPrivacy==='request'&&!opts.unlocked;
  return `
  <div class="profile-card" onclick="go('profile',{id:'${p.id}'})">
    <div class="photo">
      ${firstPhoto?`<img src="${firstPhoto}" alt="${escapeHtml(p.name)}" class="${blur?'photo-blurred':''}">`:`<i class="fa-solid fa-user-large" style="font-size:46px;opacity:.5"></i>`}
      ${ai?`<span class="ai-score" title="AI Compatibility Score"><i class="fa-solid fa-wand-magic-sparkles"></i> ${ai.score}%</span>`:''}
      ${p.verified?`<span class="verified"><i class="fa-solid ${tierIcon(p.tier)}"></i> ${escapeHtml(p.tier||'Verified')}</span>`:''}
      ${p.online?`<span class="online" style="top:${ai?'48px':'10px'}">Online</span>`:''}

    <div class="info">

PAGES.browse=function(s){

function applyBrowse(){
  const p={};
  const q=document.getElementById('q-search').value.trim();if(q)p.q=q;
  const r=document.getElementById('f-religion').value;if(r)p.religion=r;
  const g=document.getElementById('f-gender').value;if(g)p.gender=g;
  const n=document.getElementById('f-minAge').value;if(n)p.minAge=n;
  const x=document.getElementById('f-maxAge').value;if(x)p.maxAge=x;
  go('browse',p);
}

function sendInterest(id){
  const s=Store.load();
  if(!s.user){toast('Please sign in first','fa-circle-info');setTimeout(()=>go('login'),900);return;}
  if(s.interestsSent.some(i=>i.to===id)){toast('Interest already sent','fa-circle-info');return;}
  s.interestsSent.push({to:id,date:new Date().toISOString().slice(0,10)});
  Store.save(s);toast('Interest sent successfully');
}
function toggleShortlist(id){
  const s=Store.load();
  if(!s.user){toast('Please sign in first','fa-circle-info');setTimeout(()=>go('login'),900);return;}
  if(s.shortlist.includes(id)){s.shortlist=s.shortlist.filter(x=>x!==id);toast('Removed from shortlist','fa-star');}
  else{s.shortlist.push(id);toast('Added to shortlist','fa-star');}
  Store.save(s);
}

  const vPct=Math.round((vCount/7)*100);

  return `

PAGES.inbox=function(s){
  const chatIds=Object.keys(s.messages);
  let activeId=qs('to')||chatIds[0];
  if(activeId && !s.messages[activeId]){s.messages[activeId]=[];Store.save(s);}
  const activeProfile=s.profiles.find(p=>p.id===activeId);
  const otherIds=Object.keys(s.messages);
  return `
  <div class="container">
    <div class="page-head"><div><h2>My Inbox</h2><div class="sub">Conversations with your connections</div></div></div>
    <div class="chat-wrap">
      <div class="chat-list">
        ${otherIds.length?otherIds.map(id=>{
          const p=s.profiles.find(x=>x.id===id);
          if(!p)return'';
          const msgs=s.messages[id]||[];
          const last=msgs[msgs.length-1];
          return `
          <div class="item ${id===activeId?'active':''}" onclick="go('inbox',{to:'${id}'})">
            <div class="avatar">${p.photos&&p.photos[0]?`<img src="${p.photos[0]}">`:escapeHtml(p.name[0])}</div>
            <div style="flex:1;min-width:0">
              <div class="name">${escapeHtml(p.name)}</div>
              <div class="preview">${last?escapeHtml(last.text):'Say hello'}</div>
            </div>
          </div>`;
        }).join(''):'<p class="muted center" style="padding:20px">No conversations yet</p>'}
      </div>
      <div class="chat-window">
        ${activeProfile?`
          <div class="chat-header">
            <div class="avatar" style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#f4e7eb,#ead2db);display:grid;place-items:center;color:var(--primary);font-weight:700;overflow:hidden">
              ${activeProfile.photos&&activeProfile.photos[0]?`<img src="${activeProfile.photos[0]}" style="width:100%;height:100%;object-fit:cover">`:escapeHtml(activeProfile.name[0])}
            </div>
            <div style="flex:1;min-width:0">
              <div>${escapeHtml(activeProfile.name)}</div>
              <div class="muted" style="font-size:12px;font-weight:400"><i class="fa-solid fa-circle" style="color:var(--success);font-size:8px"></i> Online · ${escapeHtml(activeProfile.city)}</div>
            </div>
            <button class="btn btn-ghost btn-sm" onclick="go('profile',{id:'${activeProfile.id}'})"><i class="fa-solid fa-user"></i> View Profile</button>
          </div>
          <div class="chat-body" id="chat-body">
            ${(s.messages[activeId]||[]).map(m=>`
              <div class="chat-msg ${m.from}">${escapeHtml(m.text)}<div style="font-size:10.5px;opacity:.7;margin-top:4px;text-align:right">${m.t||''}</div></div>
            `).join('')}
          </div>
          <div class="chat-input">
            <input type="text" id="msg" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMsg('${activeId}')">
            <button class="btn btn-primary" onclick="sendMsg('${activeId}')"><i class="fa-solid fa-paper-plane"></i></button>
          </div>
        `:`<div style="padding:60px;text-align:center;color:var(--muted)"><i class="fa-solid fa-comments ic-lg"></i><p class="mt-2">Select a conversation or start one from a profile page</p></div>`}
      </div>
    </div>
    <div class="alert alert-warn mt-2"><i class="fa-solid fa-shield-halved"></i><div><b>Stay Safe:</b> Never share money, bank details or OTPs with anyone you meet here. Report suspicious behavior.</div></div>
  </div>
  <script>setTimeout(()=>{const c=document.getElementById('chat-body');if(c)c.scrollTop=c.scrollHeight;},20);<\/script>`;
};
function sendMsg(id){
  const input=document.getElementById('msg');const text=input.value.trim();if(!text)return;
  const s=Store.load();s.messages[id]=s.messages[id]||[];
  const t=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  s.messages[id].push({from:'me',text,t});Store.save(s);render();
  setTimeout(()=>{const s2=Store.load();s2.messages[id].push({from:'them',text:'Thank you for your message. I will respond shortly.',t:new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})});Store.save(s2);render();},1200);
}

PAGES['ai-matches']=function(s){
  const me=getMe(s);
  const scored=s.profiles.filter(p=>p.id!==me.id&&p.gender!==me.gender).map(p=>({p,ai:aiMatchScore(me,p)})).sort((a,b)=>b.ai.score-a.ai.score);
  const top=scored.filter(x=>x.ai.score>=70);

        <button class="btn btn-primary btn-sm" onclick="toast('AI refreshed','fa-wand-magic-sparkles')" style="background:#6d28d9"><i class="fa-solid fa-arrows-rotate"></i> Refresh</button>
      </div>

        <div style="background:#fff;padding:14px;border-radius:10px;text-align:center"><div style="font-family:'Playfair Display';font-size:26px;color:#6d28d9;font-weight:700">${top.length}</div><div class="muted" style="font-size:12px">Highly compatible</div></div>
        <div style="background:#fff;padding:14px;border-radius:10px;text-align:center"><div style="font-family:'Playfair Display';font-size:26px;color:#6d28d9;font-weight:700">${also.length}</div><div class="muted" style="font-size:12px">Also worth exploring</div></div>
        <div style="background:#fff;padding:14px;border-radius:10px;text-align:center"><div style="font-family:'Playfair Display';font-size:26px;color:#6d28d9;font-weight:700">40+</div><div class="muted" style="font-size:12px">Signals analysed</div></div>
        <div style="background:#fff;padding:14px;border-radius:10px;text-align:center"><div style="font-family:'Playfair Display';font-size:26px;color:#6d28d9;font-weight:700">Daily</div><div class="muted" style="font-size:12px">Fresh each morning</div></div>
      </div>
      <style>@media(max-width:700px){.ai-widget [style*="grid-template-columns:repeat(4,1fr)"]{grid-template-columns:repeat(2,1fr)!important}}</style>
    </div>

    <h2 style="font-family:'Inter',sans-serif;font-size:20px;margin:0 0 14px"><i class="fa-solid fa-medal" style="color:var(--accent)"></i> Top Matches For You</h2>
    ${top.length?`<div class="grid grid-2">
      ${top.slice(0,6).map(x=>`
