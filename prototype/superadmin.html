function switchTab(name,el){
  document.querySelectorAll('.sidebar a').forEach(a=>a.classList.remove('active'));

}

function renderAdmins(){

    <button class="btn btn-primary mt-1" onclick="addAdmin()">+ Add New Admin</button>

    <table class="data mt-2">
      <tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr>
      ${s.admins.map(a=>`
        <tr>
          <td><b>${a.id}</b></td>
          <td>${a.name}</td>
          <td>${a.email}</td>
          <td><span class="status-pill ${a.role==='superadmin'?'status-verified':'status-active'}">${a.role}</span></td>
          <td><span class="status-pill status-active">${a.status}</span></td>
          <td>
            <button class="btn btn-ghost btn-sm">Edit</button>
            ${a.role!=='superadmin'?`<button class="btn btn-danger btn-sm" onclick="removeAdmin('${a.id}')">Remove</button>`:''}
          </td>
        </tr>`).join('')}
    </table>

    <h3 class="mt-3">🔑 Roles & Permissions</h3>
    <div class="grid grid-3 mt-1">
      <div class="card"><div class="card-body">
        <h4>Super Admin</h4>
        <p class="muted" style="font-size:13px;">Full access. Manage admins, plans, settings, payments, system.</p>
      </div></div>
      <div class="card"><div class="card-body">
        <h4>Admin</h4>
        <p class="muted" style="font-size:13px;">Manage profiles, approvals, reports. No financial / system access.</p>
      </div></div>
      <div class="card"><div class="card-body">
        <h4>Moderator</h4>
        <p class="muted" style="font-size:13px;">Approve photos, handle reports, moderate chat. Read-only on profiles.</p>
      </div></div>
    </div>
  `;
}
function addAdmin(){
  const name=prompt('Admin name:');if(!name)return;
  const email=prompt('Admin email:');if(!email)return;
  const role=prompt('Role (admin/moderator):','admin');if(!role)return;
  const s=Store.load();
  s.admins.push({id:'AD'+String(s.admins.length+1).padStart(3,'0'),name,email,role,status:'active'});
  Store.save(s);renderAdmins();toast('✅ Admin added');
}
function removeAdmin(id){
  if(!confirm('Remove this admin?'))return;
  const s=Store.load();s.admins=s.admins.filter(a=>a.id!==id);Store.save(s);renderAdmins();toast('Removed');
}

function renderPlans(){

    <h1 style="margin-top:0;">💰 Payment Plans</h1>
    <p class="muted">Configure plans that you can launch later. Currently <b>Free Forever</b> plan is active for everyone.</p>

    <div class="alert alert-warn">
      ⚠ <b>Heads up:</b> Activating a paid plan will start charging users. Make sure your payment gateway is connected first.
    </div>

    <button class="btn btn-primary mt-1" onclick="addPlan()">+ Create New Plan</button>

    <div class="grid grid-4 mt-2">
      ${s.plans.map(pl=>`
        <div class="card" style="border:${pl.active?'2px solid var(--primary)':'1px solid var(--border)'};">
          <div class="card-body">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <h3 style="margin:0;color:var(--primary-dark);">${pl.name}</h3>
              ${pl.default?'<span class="status-pill status-verified">DEFAULT</span>':''}
            </div>
            <div style="font-size:32px;font-weight:700;color:var(--primary);margin:8px 0;">
              ${pl.price===0?'Free':'₹'+pl.price}
            </div>
            <div class="muted" style="font-size:13px;margin-bottom:10px;">${pl.duration}</div>
            <ul style="padding-left:18px;font-size:13px;line-height:1.7;margin:0 0 12px;">
              ${pl.features.map(f=>`<li>${f}</li>`).join('')}
            </ul>
            <div style="display:flex;gap:6px;">
              <button class="btn ${pl.active?'btn-success':'btn-ghost'} btn-sm" style="flex:1;" onclick="togglePlan('${pl.id}')">
                ${pl.active?'✓ Active':'Activate'}

          </div>
        </div>`).join('')}
    </div>

    <h3 class="mt-3">🎟️ Promo Codes & Discounts</h3>
    <table class="data mt-1">
      <tr><th>Code</th><th>Discount</th><th>Usage</th><th>Expires</th><th>Status</th><th>Actions</th></tr>
      <tr><td><b>LAUNCH50</b></td><td>50% off</td><td>0 / 1000</td><td>2026-12-31</td><td><span class="status-pill status-pending">Disabled</span></td><td><button class="btn btn-ghost btn-sm">Edit</button></td></tr>
      <tr><td><b>FRIEND200</b></td><td>₹200 off</td><td>0 / 500</td><td>2026-06-30</td><td><span class="status-pill status-pending">Disabled</span></td><td><button class="btn btn-ghost btn-sm">Edit</button></td></tr>
    </table>
    <button class="btn btn-primary mt-2">+ Add Promo Code</button>
  `;
}
function togglePlan(id){
  const s=Store.load();
  const pl=s.plans.find(x=>x.id===id);
  if(!pl)return;
  if(pl.id==='P0'&&pl.active){toast('Free plan must always be active');return;}
  pl.active=!pl.active;
  Store.save(s);renderPlans();
  toast(pl.active?'✅ '+pl.name+' activated':'⏸ '+pl.name+' deactivated');
}
function editPlan(id){alert('Edit plan dialog (demo)');}
function addPlan(){alert('Create plan dialog (demo)');}
