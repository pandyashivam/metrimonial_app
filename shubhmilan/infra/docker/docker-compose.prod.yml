version: '3.9'

# Production-shaped compose file. Intended for a single-host install (Railway / Fly.io-style)
# or a VPS. Cloud deploys typically use managed MySQL / Redis / R2 and only run the API
# container — in that case, export the `api` service alone.
#
# Usage:
#   DOCKER_BUILDKIT=1 docker compose -f infra/docker/docker-compose.prod.yml build
#   docker compose -f infra/docker/docker-compose.prod.yml up -d

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shubhmilan}
      MYSQL_USER: ${MYSQL_USER:?set in env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_prod:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_prod:/data

  api:
    build:
      context: ../../
      dockerfile: server/api/Dockerfile
    image: shubhmilan-api:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?set in env}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set in env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set in env}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?set in env}
      R2_ENDPOINT: ${R2_ENDPOINT:?set in env}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?set in env}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?set in env}
      R2_BUCKET: ${R2_BUCKET:?set in env}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:?set in env}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      DIGIO_CLIENT_ID: ${DIGIO_CLIENT_ID:-}
      DIGIO_CLIENT_SECRET: ${DIGIO_CLIENT_SECRET:-}
      HYPERVERGE_APP_ID: ${HYPERVERGE_APP_ID:-}
      HYPERVERGE_APP_KEY: ${HYPERVERGE_APP_KEY:-}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL}
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL}
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/health']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mysql_prod:
  redis_prod:
