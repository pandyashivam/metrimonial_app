version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: shubhmilan-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: shubhmilan_root
      MYSQL_DATABASE: shubhmilan
      MYSQL_USER: shubhmilan
      MYSQL_PASSWORD: shubhmilan
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-pshubhmilan_root']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shubhmilan-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: shubhmilan-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      retries: 6

  # Creates the shubhmilan-photos bucket on first run.
  minio-init:
    image: minio/mc:latest
    container_name: shubhmilan-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 5 &&
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/shubhmilan-photos &&
      mc anonymous set download local/shubhmilan-photos &&
      echo 'Bucket ready'
      "

volumes:
  mysql_data:
  redis_data:
  minio_data:
